name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck, lint, format check and unit tests
        run: npm run check
      - name: Build site
        run: npm run build
      - name: Check proxy and Lab syntax
        run: |
          node --check server/proxy.mjs
          python3 -m py_compile lab/server.py
